# Docs site: build on every pull request that touches it, deploy to Cloudflare Pages when it merges to main.
# lyceum-docs is a direct-upload Pages project, so the deploy is a wrangler upload from CI.
name: docs-site

on:
  pull_request:
    paths: [docs-site/**, cmd/**, internal/cli/**, go.mod, go.sum, .github/workflows/docs-site.yml]
  push:
    branches: [main]
    paths: [docs-site/**, cmd/**, internal/cli/**, go.mod, go.sum, .github/workflows/docs-site.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Build the CLI the reference is generated from
        run: CGO_ENABLED=0 go build -o dist/lyceum ./cmd/lyceum
      - name: Install
        working-directory: docs-site
        run: npm ci
      - name: Generator tests
        working-directory: docs-site
        run: npm test
      - name: Build
        working-directory: docs-site
        run: npm run build
      - name: Sitemap, CLI reference and llms files were generated
        working-directory: docs-site
        run: test -s dist/sitemap-index.xml && test -s dist/reference/cli/index.html && test -s dist/llms.txt && test -s dist/llms-full.txt && test -s dist/start/install.md
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: docs-site-dist
          path: docs-site/dist
          retention-days: 1

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: docs-site-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site-dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy."
            exit 0
          fi
          npx --yes wrangler@4.158.0 pages deploy dist --project-name=lyceum-docs --branch=main --commit-dirty=true
